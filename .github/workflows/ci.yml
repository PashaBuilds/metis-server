name: CI

# Actions dakikaları sınırlı (özel depo; Windows dakikası 2 kat sayılır). Bu yüzden:
# - yalnız belge değişen gönderimler CI çalıştırmaz,
# - aynı daldaki eski koşu, yenisi başlayınca iptal edilir,
# - Windows işi yalnız paketi/Windows davranışını etkileyen değişikliklerde, sürüm yayımlarken,
#   commit mesajında [windows] varsa veya elle (Actions → CI → Run workflow) çalıştırılınca koşar.
# Release CI'da derlenmez/yayımlanmaz (ürün sahibinin kararı, 2026-10-18): yayımlanan ZIP, yerel Windows'ta derlenip
# çift tıklamayla denenmiş ZIP'in kendisidir (scripts/release.ps1). Windows işi yalnız testtir: temiz Windows
# Server'da ağ kapalı kurulum, yükseltme, yedek ve kaldırma. scripts/release.ps1 bu commit'te CI yeşil olmadan yayımlamaz.
# Ürün sahibinin kararı (2026-10-19): push'ta otomatik CI yok. scripts/release.ps1 -Derle her sürüm adayı için bu iş
# akışını bir kez başlatır (gh workflow run) ve yerel derlemeyle paralel koşar; -Yayimla o commit'te yeşil ister.
# Yerelde yapılamayanlar burada: uçtan uca Playwright (Linux) ve temiz Windows Server'da çevrimdışı kurulum/yükseltme.
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Değişiklik kapsamı
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      windows: ${{ steps.scope.outputs.windows }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - id: scope
        env:
          BEFORE: ${{ github.event.before }}
          MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          run=false
          if [ "${GITHUB_EVENT_NAME}" != "push" ]; then run=true
          elif printf '%s' "$MESSAGE" | grep -qF '[windows]'; then run=true
          # deploy/RELEASE henüz etiketlenmemiş bir sürüm adı taşıyorsa (yayımlanacak): Windows testi koşmalı.
          # Yalnız son gönderimin farkına bakmak yetmez: önceki gönderimin koşusu iptal edilmiş olabilir.
          elif tag="$(tr -d '[:space:]' < deploy/RELEASE 2>/dev/null)" && [ -n "$tag" ] && ! git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then run=true
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then run=true
          elif git diff --name-only "$BEFORE" "$GITHUB_SHA" | grep -qE '^(deploy/|pyproject\.toml$|services/metis/(ops|modules/attachments)/|services/metis/cli\.py$|services/metis/modules/sources/pdf_extract\.py$)'; then run=true
          fi
          echo "windows=$run" >> "$GITHUB_OUTPUT"
          echo "Windows işi: $run"

  linux:
    name: Linux — lint, typecheck, pytest, Playwright
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: metis_owner
          POSTGRES_PASSWORD: metis-dev
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metis_owner" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      METIS_TEST_ADMIN_DSN: postgresql://metis_owner:metis-dev@127.0.0.1:5432/postgres
      PGPASSWORD: metis-dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: PostgreSQL istemci araçları ve çalışma zamanı rolü
        run: |
          sudo apt-get update -q && sudo apt-get install -yq postgresql-client-16
          psql -h 127.0.0.1 -U metis_owner -d postgres -c "CREATE ROLE metis_app LOGIN PASSWORD 'metis-dev'"
      - name: Python bağımlılıkları (.venv — betikler bu yolu kullanır)
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"
      - name: Ruff
        run: .venv/bin/ruff check services tests evals deploy
      - name: OpenAPI sözleşmesi güncel mi
        run: |
          .venv/bin/python scripts/export_openapi.py /tmp/openapi.json
          diff -u apps/web/openapi.json /tmp/openapi.json
      - name: pytest (gerçek PostgreSQL 16)
        run: .venv/bin/pytest -q
      - name: Değerlendirme (mock model)
        run: .venv/bin/python evals/run.py --mode mock
      - name: Web bağımlılıkları
        run: npm ci
      - name: Typecheck, lint, build
        run: |
          npm run typecheck -w @metis/web
          npm run lint -w @metis/web
          npm run build:web
      - name: Geliştirme yığını (vitrin ve harita ölçümü için kurgusal veri)
        run: |
          psql -h 127.0.0.1 -U metis_owner -d postgres -c "CREATE DATABASE metis"
          scripts/dev-up.sh --demo
          METIS_ENV=development METIS_MASTER_KEY_FILE=$PWD/.data/master.key .venv/bin/metis demo-graph --nodes 200
      - name: Playwright (vitrin + e2e)
        run: |
          npx playwright install --with-deps chromium
          npx playwright test -c apps/web/playwright.config.ts tests/visual
          npx playwright test -c apps/web/playwright.e2e.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: apps/web/test-results, retention-days: 7 }

  windows:
    name: Windows — pytest + çevrimdışı kurulum duman testi
    needs: changes
    if: needs.changes.outputs.windows == 'true'
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      METIS_TEST_ADMIN_DSN: postgresql://postgres:root@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - name: PostgreSQL 16 (runner'da önyüklü sürüm 14; METIS 16+ ister)
        shell: pwsh
        timeout-minutes: 10
        run: |
          # EDB'nin ikili ZIP'i: kurucu (choco) pgAdmin vb. ile ~9,5 dk sürüyordu; ZIP + initdb + servis ~1 dk.
          # Kullanıcının kurduğu yerleşimle aynı: C:\Program Files\PostgreSQL\16\bin, servis NetworkService ile.
          Get-Service -Name "postgresql*" | Stop-Service -ErrorAction SilentlyContinue
          $ver = "16.15-1"
          $zip = Join-Path $env:RUNNER_TEMP "pg.zip"
          Invoke-WebRequest -UseBasicParsing -MaximumRetryCount 3 -RetryIntervalSec 5 -OutFile $zip `
            "https://get.enterprisedb.com/postgresql/postgresql-$ver-windows-x64-binaries.zip"
          $tmp = New-Item -ItemType Directory (Join-Path $env:RUNNER_TEMP "pg")
          tar -xf $zip -C $tmp pgsql/bin pgsql/lib pgsql/share
          if ($LASTEXITCODE) { throw "PostgreSQL ZIP'i açılamadı" }
          $root = "C:\Program Files\PostgreSQL\16"
          Move-Item (Join-Path $tmp "pgsql") $root
          $pgbin = "$root\bin"
          $data = "C:\pgdata"
          # initdb yönetici olarak kısıtlı belirteçle çalışır ve RUNNER_TEMP'teki --pwfile'ı okuyamıyor: önce trust,
          # parola SQL ile verilir, sonra pg_hba scram-sha-256'ya çevrilip yeniden yüklenir.
          & "$pgbin\initdb.exe" -D $data -U postgres -A trust -E UTF8
          if ($LASTEXITCODE) { throw "initdb başarısız" }
          icacls $data /grant "NT AUTHORITY\NetworkService:(OI)(CI)F" /T /Q | Out-Null
          & "$pgbin\pg_ctl.exe" register -N postgresql-x64-16 -U "NT AUTHORITY\NetworkService" -D $data -S auto
          if ($LASTEXITCODE) { throw "servis kaydı başarısız" }
          Start-Service postgresql-x64-16
          "PGBIN=$pgbin" | Out-File -Append $env:GITHUB_ENV
          "$pgbin" | Out-File -Append $env:GITHUB_PATH
          for ($i = 0; $i -lt 30; $i++) { & "$pgbin\pg_isready.exe" -h 127.0.0.1 -q; if (-not $LASTEXITCODE) { break }; Start-Sleep 1 }
          & "$pgbin\psql.exe" -w -U postgres -h 127.0.0.1 -c "ALTER USER postgres PASSWORD 'root'"
          if ($LASTEXITCODE) { throw "postgres parolası verilemedi" }
          $hba = Join-Path $data "pg_hba.conf"
          (Get-Content $hba) -replace '\btrust$', 'scram-sha-256' | Set-Content $hba
          & "$pgbin\psql.exe" -w -U postgres -h 127.0.0.1 -c "SELECT pg_reload_conf();" | Out-Null
          $env:PGPASSWORD = "root"
          & "$pgbin\psql.exe" -w -U postgres -h 127.0.0.1 -c "SELECT version();"
          if ($LASTEXITCODE) { throw "PostgreSQL'e parolayla bağlanılamadı" }
          if (Select-String -Path $hba -Pattern '\btrust$' -Quiet) { throw "pg_hba hâlâ trust" }
      - name: pytest (Windows, PG servisi)
        shell: pwsh
        timeout-minutes: 30
        run: |
          python -m pip install -e ".[dev]"
          $env:METIS_PG_BIN = $env:PGBIN
          pytest -q -rfE --durations=15 tests/api tests/ops tests/notes
      - name: Paketi üret (internet açık; yalnız bu testler için — yayımlanmaz)
        shell: pwsh
        run: |
          npm ci
          python deploy/build-bundle.py --target win64 --locked --require-launcher
          python deploy/build-bundle.py --target win64 --locked --require-launcher --skip-web-build --version-suffix +ci2 --out dist-next
      - name: Çevrimdışı kurulum — METIS-Baslat.exe ile (ağ kapalı adım)
        shell: pwsh
        # Ağ kapalı: tüm HTTP(S) istekleri erişilemeyen bir vekile yönlendirilir ve pip --no-index ile çalışır.
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          PIP_NO_INDEX: "1"
          METIS_PG_SUPERUSER_PASSWORD: root
        run: |
          # Kullanıcı yolu: ZIP'i aç, METIS-Baslat.exe'yi çalıştır. CI'da soru sormayan mod (-Onayla); exe → baslat.ps1
          # → install-offline.ps1. Etkileşimli kısımlar (UAC, ileti kutuları, parola sorusu) burada sınanamaz.
          $zip = Get-ChildItem dist\METIS-*-server-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\bundle
          cd (Get-ChildItem C:\bundle -Directory | Select-Object -First 1).FullName
          if (-not (Test-Path .\METIS-Baslat.exe)) { throw "METIS-Baslat.exe pakette yok" }
          $p = Start-Process -FilePath .\METIS-Baslat.exe -Wait -PassThru `
            -ArgumentList "-Onayla -DemoYok -TarayiciAcma -PgBin `"$env:PGBIN`" -SonucDosyasi C:\baslat-kur.json"
          Get-Content C:\baslat-kur.json
          if ($p.ExitCode -ne 0) { throw "başlatıcı ile kurulum başarısız (çıkış $($p.ExitCode))" }
          $s = Get-Content -Raw C:\baslat-kur.json | ConvertFrom-Json
          if ($s.sonuc -ne "kuruldu" -or -not $s.calisiyor -or $s.kurulu_surum -ne $s.paket_surumu) { throw "başlatıcı durumu beklenmedik" }
          if ((Get-Content C:\METIS\adres.txt) -ne "http://localhost:8000") { throw "adres.txt yazılmadı" }
          # İkinci çalıştırma: kurulu ve çalışıyor → yalnız açar (ilk yönetici yok: yeni kurulum kodu üretir).
          $p = Start-Process -FilePath .\METIS-Baslat.exe -Wait -PassThru -ArgumentList "-Onayla -TarayiciAcma -SonucDosyasi C:\baslat-ac.json"
          $s = Get-Content -Raw C:\baslat-ac.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or $s.sonuc -ne "acildi" -or -not $s.kurulum_gerekli) { throw "başlatıcı ikinci çalıştırma beklenmedik: $($s | ConvertTo-Json -Compress)" }
      - name: Duman testi — giriş, yeniden başlatma, kalıcılık, yedek, tatbikat
        shell: pwsh
        run: |
          $base = "http://127.0.0.1:8000"
          $h = @{ Origin = "http://localhost:8000" }
          $code = (& C:\METIS\bin\metis.cmd setup-code | Select-Object -Last 1).Trim()
          $s = $null
          $me = Invoke-RestMethod -Method Post "$base/api/v1/setup" -Headers $h -ContentType "application/json" -SessionVariable s `
            -Body (@{ code = $code; display_name = "CI Yönetici"; username = "ci"; password = "Kurgusal-Parola-2026"; project_name = "CI" } | ConvertTo-Json)
          $pid_ = $me.memberships[0].project_id
          $h["X-CSRF-Token"] = $me.csrf_token
          $meta = @{ title = "Kalıcılık"; kind = "note"; text = "CI kalıcılık testi."; scope = @{ domain = @("*"); yatt = @("*"); kart = @("*"); proje = @("*") }; acl = @() } | ConvertTo-Json -Compress
          $form = @{ meta = $meta }
          Invoke-RestMethod -Method Post "$base/api/v1/projects/$pid_/sources" -Headers $h -WebSession $s -Form $form | Out-Null
          Restart-Service metis-api, metis-worker
          # Hazır olana kadar bekle (sabit 15 sn, servisin durması uzadığında yetmiyordu; 2.0.27 adayı).
          $ready = $false
          foreach ($i in 1..45) { try { if ((Invoke-WebRequest -UseBasicParsing -NoProxy http://127.0.0.1:8000/api/v1/health/ready).StatusCode -eq 200) { $ready = $true; break } } catch {}; Start-Sleep -Seconds 2 }
          if (-not $ready) { throw "yeniden başlatma sonrası hazır değil" }
          $login = Invoke-RestMethod -Method Post "$base/api/v1/auth/login" -Headers @{ Origin = "http://localhost:8000" } -ContentType "application/json" -SessionVariable s2 `
            -Body (@{ username = "ci"; password = "Kurgusal-Parola-2026" } | ConvertTo-Json)
          $src = Invoke-RestMethod "$base/api/v1/projects/$pid_/sources" -WebSession $s2
          if (-not ($src.items | Where-Object { $_.title -eq "Kalıcılık" })) { throw "Yeniden başlatma sonrası veri yok" }
          & C:\METIS\bin\metis.cmd backup
          if ($LASTEXITCODE -ne 0) { throw "yedek başarısız" }
          & C:\METIS\bin\metis.cmd restore --rehearsal latest
          if ($LASTEXITCODE -ne 0) { throw "geri yükleme tatbikatı başarısız" }
      - name: Yükseltme betiği (ağ kapalı)
        shell: pwsh
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          PIP_NO_INDEX: "1"
        run: |
          $zip = Get-ChildItem dist-next\METIS-*-server-win64.zip | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath C:\bundle-next
          cd (Get-ChildItem C:\bundle-next -Directory | Select-Object -First 1).FullName
          # Yeni paketin başlatıcısı kurulu sürümün farklı olduğunu görür ve yükseltir (upgrade.ps1: yedek → geçiş).
          $p = Start-Process -FilePath .\METIS-Baslat.exe -Wait -PassThru -ArgumentList "-Onayla -TarayiciAcma -SonucDosyasi C:\baslat-yukselt.json"
          Get-Content C:\baslat-yukselt.json
          $s = Get-Content -Raw C:\baslat-yukselt.json | ConvertFrom-Json
          if ($p.ExitCode -ne 0 -or $s.kurulu_surum -ne $s.paket_surumu) { throw "başlatıcı ile yükseltme başarısız" }
          $r = Invoke-WebRequest -UseBasicParsing -NoProxy http://127.0.0.1:8000/api/v1/health/ready
          if ($r.StatusCode -ne 200) { throw "yükseltme sonrası hazır değil" }
          (Get-Item C:\METIS\app\current).Target
      - name: Kaldırma betiği (varsayılan, sonra -RemoveAll)
        shell: pwsh
        timeout-minutes: 10
        env:
          METIS_PG_SUPERUSER_PASSWORD: root
        run: |
          # Günlükleri sonraki adım için sakla (kaldırma C:\METIS'i siler).
          Copy-Item -Recurse C:\METIS\data\logs C:\metis-logs
          cd (Get-ChildItem C:\bundle-next -Directory | Select-Object -First 1).FullName
          .\uninstall.ps1 -InstallRoot C:\METIS
          if (Get-Service metis-api, metis-worker -ErrorAction SilentlyContinue) { throw "servisler kaldırılmadı" }
          if (Get-ScheduledTask -TaskName "METIS*" -ErrorAction SilentlyContinue) { throw "zamanlanmış görevler kaldırılmadı" }
          if (Test-Path C:\METIS\app) { throw "program dosyaları kaldı" }
          if (-not (Test-Path C:\METIS\config\master.key)) { throw "varsayılan kaldırma ana anahtarı silmemeliydi" }
          $env:PGPASSWORD = "root"
          function Q([string]$Sql) {
            $r = & "$env:PGBIN\psql.exe" -w -U postgres -h 127.0.0.1 -tAc $Sql
            if ($LASTEXITCODE -ne 0) { throw "psql başarısız: $Sql" }
            return "$r".Trim()
          }
          if ((Q "SELECT 1 FROM pg_database WHERE datname='metis'") -ne "1") { throw "varsayılan kaldırma veritabanını silmemeliydi" }
          .\uninstall.ps1 -InstallRoot C:\METIS -RemoveAll
          if ($env:PGPASSWORD -ne "root") { throw "kaldırma betiği çağıranın PGPASSWORD değerini bozdu" }
          if (Test-Path C:\METIS) { throw "C:\METIS kaldı" }
          if (Q "SELECT 1 FROM pg_database WHERE datname='metis'") { throw "veritabanı kaldı" }
          if (Q "SELECT 1 FROM pg_roles WHERE rolname LIKE 'metis_%'") { throw "roller kaldı" }
          "kaldırma doğrulandı"
      - name: Servis günlükleri
        if: always()
        shell: pwsh
        timeout-minutes: 3
        run: |
          # Önce başlatıcı günlükleri (METIS-Baslat.exe gizli pencerede çalışır; ayrıntı yalnız buradadır).
          Get-ChildItem (Join-Path $env:TEMP "METIS") -File -ErrorAction SilentlyContinue | ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -Tail 120 }
          # Önce var olanları süz: olmayan bir yol -Recurse ile verilirse PowerShell adı üst klasörde (C:\) özyinelemeli arar
          # ve adım zaman sınırına takılır.
          @("C:\METIS\data\logs", "C:\metis-logs") | Where-Object { Test-Path $_ } | Get-ChildItem -Recurse -File | ForEach-Object { "--- $($_.FullName)"; Get-Content $_.FullName -Tail 50 }
